<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F58220" />
  <meta name="description" content="ZMart - Fresh groceries delivered fast. Shop online and order via WhatsApp." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ZMart" />
  <title>ZMart - Grocery Delivery</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandOrange: '#F58220',
            brandGreen: '#1F5A3A',
            brandBg: '#F8FAFC'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brandBg min-h-[100dvh] font-sans antialiased">
  <button type="button" data-action="install-app" class="w-full bg-brandOrange text-white font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2">
      <i class="fa-solid fa-download"></i>
      Install ZMart App
  </button>

  <!-- Offline Banner -->
  <div id="offline-banner" class="hidden-banner fixed top-0 inset-x-0 z-[200] bg-slate-800 text-white text-center text-sm py-2 px-4" aria-hidden="true" role="status">
    <i class="fa-solid fa-wifi-slash mr-2"></i> You're offline
  </div>

  <div id="app" class="flex flex-col min-h-[100dvh]">
    <div id="app-header"></div>
    <main id="app-main" class="flex-1 overflow-y-auto no-scrollbar"></main>
    <div id="app-nav"></div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="z-[100]"></div>

  <!-- Modal Root -->
  <div id="modal-root" class="z-[90]"></div>

  <!-- Desktop Cart Drawer -->
  <div id="cart-drawer-root" class="z-[80]"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
